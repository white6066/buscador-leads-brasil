name: Prospecção Diária de Leads

on:
  schedule:
    # Roda todos os dias às 07:00 BRT (10:00 UTC)
    - cron: '0 10 * * *'
  
  # Permite executar manualmente a qualquer momento para testes
  workflow_dispatch:

jobs:
  executar-buscador:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de busca e envio
        run: python buscador.py
