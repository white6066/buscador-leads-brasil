name: Executar Automacao de CNPJ

on:
  schedule:
    - cron: '0 10,15 * * *'  # Roda às 10:00 e 15:00 UTC (07:00 e 12:00 no horário de Brasília)
  workflow_dispatch:          # Permite executar manualmente quando quiseres

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install requests gspread google-auth aiohttp

      - name: Rodar Automação
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python main.py
